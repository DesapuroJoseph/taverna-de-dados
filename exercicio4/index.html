    <main class="container">
        <!-- TÍTULO -->
        <h1>Galeria da Estante</h1>
        <p>Essa é a galeria de jogos disponíveis com suas respectivas capas, totalmente abertos para inscrição.</p>

        <!-- GALERIA -->
        <section class="galeria">
            <figure>
                <img src="img/Courbet_-_Castle_of_Chillon,_Evening,_1872,_1958.47.jpg"
                     alt="Pintura de um castelo de pedra na beira de um lago, ao entardecer">
                <figcaption><strong>Reinos da Lagoa</strong><br>Gustave Courbet, 1872</figcaption>
            </figure>

            <figure>
                <img src="img/Joseph_Wright_of_Derby_-_A_Grotto_in_the_Gulf_of_Salerno,_Sunset_-_Google_Art_Project.jpg"
                     alt="Pintura do interior escuro de uma gruta de pedra aberta para o mar ao pôr do sol">
                <figcaption><strong>Expedição Subterrânea</strong><br>Joseph Wright of Derby, c. 1780</figcaption>
            </figure>

            <figure>
                <img src="img/Jan_Steen_-_Tavern_Scene_-_WGA21757.jpg"
                     alt="Pintura de pessoas bebendo e conversando em volta de uma mesa dentro de uma taverna">
                <figcaption><strong>Taverna em Chamas</strong><br>Jan Steen, c. 1670</figcaption>
            </figure>

            <figure>
                <!-- LINK PARA CADASTRO (EXERCÍCIO 2) -->
                <a href="../exercicio2/index.html">
                    <img src="img/George_Frederick_Watts_-_Sir_Galahad_-_1943.209_-_Fogg_Museum.jpg"
                         alt="Pintura de um cavaleiro de armadura ao lado de um cavalo branco em uma floresta">
                </a>
                <figcaption><strong>Crônicas de Ferro</strong><br>George Frederic Watts, 1862</figcaption>
            </figure>

            <figure>
                <img src="img/Hendrik_Willem_Mesdag_-_Vuurtoren_in_de_branding.jpg"
                     alt="Pintura de um farol em meio a ondas agitadas do mar">
                <figcaption><strong>Farol na Tempestade</strong><br>Hendrik Willem Mesdag</figcaption>
            </figure>

            <figure>
                <a href="../exercicio2/index.html">
                    <img src="img/Saint_George_and_the_Dragon_by_Paolo_Uccello_(London)_01.jpg"
                         alt="Pintura de um cavaleiro a cavalo atacando um dragão com uma lança, ao lado de uma princesa">
                </a>
                <figcaption><strong>Lendas da Serra</strong><br>Paolo Uccello, c. 1456</figcaption>
            </figure>
